<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>حصص الانتظار | الابتدائية السابعة بالوجه</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#10b981;
      --secondary:#059669;
      --dark:#047857;
      --light:#d1fae5;
      --accent:#fbbf24;
      --lab-color:#8b5cf6;
      --lab-dark:#7c3aed;
      --lab-light:#ede9fe;
      --text:#0f172a;
      --gray:#475569;
      --container:94vw;
      --card-bg:#ffffff;
      --shadow:0 4px 12px rgba(16,185,129,.1);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html, body{
      font-family:'Tajawal', system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 50%,#f0fdf4 100%);
      color:var(--text);
      line-height:1.65;
      min-height:100vh;
      overflow-x:hidden;
      font-size:16px;
      -webkit-text-size-adjust:100%;
      text-rendering:optimizeLegibility;
    }

    .header-logo{
      background:#fff;
      position:sticky;
      top:0;
      z-index:1000;
      box-shadow:0 4px 12px rgba(16,185,129,.1);
      border-bottom:2px solid var(--light);
      padding:8px 0;
    }
    .header-logo .wrap{
      width:var(--container);
      max-width:1200px;
      margin:0 auto;
      padding:0 12px;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
    }
    .header-logo img{
      height:84px;
      width:auto;
      object-fit:contain;
      display:block;
    }
    .header-text{text-align:center;margin-top:10px;}
    .header-text h1{color:var(--dark);font-size:1.8rem;margin-bottom:5px;font-weight:900;}
    .header-text p{color:var(--gray);font-size:1rem;}
    .quran-verse{margin-top:10px;font-size:1.1rem;font-weight:700;color:var(--dark);}

    nav{
      background:linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      padding: 15px 0;
      box-shadow: 0 4px 12px rgba(16,185,129,.2);
    }
    .nav-container{width:var(--container);max-width:1200px;margin:0 auto;padding:0 12px;}
    .nav-title{color:#fff;text-align:center;margin-bottom:15px;font-size:1.3rem;font-weight:900;}

    .cards-container{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:18px;
    }

    /* === إصلاح iOS: استخدم button بدل div + event listener بدل onclick === */
    .card{
      appearance:none;
      border:none;
      width:100%;
      background:var(--card-bg);
      border-radius:12px;
      padding:18px;
      box-shadow:var(--shadow);
      transition:transform .2s, box-shadow .2s;
      cursor:pointer;
      border:1px solid rgba(0,0,0,.04);
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      font-family:'Tajawal',sans-serif;
    }
    .card:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,.12);}
    .card:active{transform:scale(.99);}
    .card .icon{
      font-size:2.2rem;
      width:62px;height:62px;
      display:flex;align-items:center;justify-content:center;
      border-radius:999px;
      background:rgba(16,185,129,.08);
      color:var(--primary);
      margin-bottom:4px;
    }
    .card .title{font-size:1.05rem;font-weight:900;color:var(--dark);}
    .card .subtitle{font-size:.8rem;color:#6b7280;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
    .card .subtitle span{
      background:#e5e7eb;
      padding:3px 9px;
      border-radius:999px;
      font-size:.75rem;
    }
    .card.featured{border-top:3px solid var(--accent);}
    .card.labs{border-top:3px solid var(--lab-color);}
    .card.labs .icon{background:rgba(139,92,246,.12);color:var(--lab-color);}

    #iframe-container{width:100%;height:80vh;display:none;margin-top:20px;padding:0 1rem;}
    #content-frame{width:100%;height:100%;border-radius:12px;box-shadow:var(--shadow);border:none;background:#fff;}

    #local-pages{width:100%;max-width:1200px;margin:20px auto 40px;padding:0 1rem 80px;display:none;}
    .card-page{
      background:linear-gradient(135deg,#ffffff 0%,#ecfdf5 100%);
      padding:22px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(15,118,110,.12);
    }
    .wait-intro,.lab-intro,.general-intro{
      text-align:center;
      color:var(--gray);
      font-size:.95rem;
      margin-bottom:18px;
    }

    .form{display:grid;gap:14px;}
    .grid-3{display:grid;grid-template-columns:1fr;gap:10px;}
    @media (min-width:768px){.grid-3{grid-template-columns:repeat(3,1fr);}}
    label{display:flex;flex-direction:column;gap:6px;color:var(--text);font-weight:800;font-size:.88rem;}

    .input,textarea,select{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:2px solid #bbf7d0;
      background:#fefdf9;
      font-family:'Tajawal',sans-serif;
      font-size:1rem;
      transition:all .2s;
      color:var(--text);
      line-height:1.75;
    }

    /* === إصلاح "الأهداف" على الآيفون: نص عربي مضبوط بدون تداخل === */
    textarea{
      min-height:110px;
      resize:vertical;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      word-break:break-word;
      direction:rtl;
      unicode-bidi:plaintext;
      letter-spacing:0;
      word-spacing:0;
      text-align:right;
    }

    .input:focus,textarea:focus,select:focus{
      outline:none;border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(16,185,129,.18);
      background:#fff;
    }
    .lab-form .input,.lab-form textarea{border-color:var(--lab-light);}
    .lab-form .input:focus,.lab-form textarea:focus{
      border-color:var(--lab-color);
      box-shadow:0 0 0 3px rgba(139,92,246,.18);
    }

    .chipset{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
    .chip{
      display:flex;align-items:center;gap:6px;
      background:linear-gradient(135deg,#ecfdf5,#dcfce7);
      padding:7px 10px;border-radius:999px;
      border:1px solid #bbf7d0;
      font-size:.82rem;cursor:pointer;transition:all .2s;
      user-select:none;
    }
    .chip input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;}
    .chip:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,185,129,.25);}

    .actions{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
    @media (min-width:768px){.actions{flex-direction:row;}}
    .btn{
      border:none;border-radius:14px;
      padding:10px 16px;font-weight:900;font-size:.95rem;
      cursor:pointer;
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      color:#fff;
      box-shadow:0 4px 15px rgba(16,185,129,.35);
      transition:transform .15s, box-shadow .15s;
      width:100%;text-align:center;
      font-family:'Tajawal',sans-serif;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,185,129,.45);}
    .btn:active{transform:scale(.99);}
    .btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 4px 15px rgba(185,28,28,.35);}
    .lab-form .btn{
      background:linear-gradient(135deg,var(--lab-color),var(--lab-dark));
      box-shadow:0 4px 15px rgba(139,92,246,.35);
    }

    .date-with-hijri{position:relative;}
    .date-input-container{position:relative;display:flex;align-items:center;}
    .date-input-container .input{padding-right:44px;cursor:pointer;}
    .hijri-toggle{
      position:absolute;left:7px;top:50%;transform:translateY(-50%);
      background:transparent;border:none;cursor:pointer;
      width:30px;height:30px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      transition:all .2s;
    }
    .hijri-toggle:hover{background:rgba(16,185,129,.12);}
    .hijri-icon{width:18px;height:18px;fill:var(--dark);}
    .hijri-calendar{
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      background:#fff;border-radius:14px;
      box-shadow:0 10px 30px rgba(15,118,110,.2);
      padding:12px;z-index:1500;width:90vw;max-width:320px;
      border:2px solid #bbf7d0;display:none;
    }
    .hijri-calendar.active{display:block;animation:fadeIn .2s ease;}
    .hijri-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #e5e7eb;}
    .hijri-month-year{font-weight:900;color:var(--dark);font-size:.95rem;}
    .hijri-nav{display:flex;gap:4px;}
    .hijri-nav button{
      background:#ecfdf5;border:none;border-radius:6px;
      padding:3px 7px;cursor:pointer;font-size:.75rem;
      font-weight:900;color:var(--dark);transition:all .2s;
      font-family:'Tajawal',sans-serif;
    }
    .hijri-nav button:hover{background:var(--primary);color:#fff;}
    .hijri-weekdays{
      display:grid;grid-template-columns:repeat(7,1fr);
      text-align:center;font-weight:900;color:var(--dark);
      font-size:.75rem;margin-bottom:4px;
    }
    .hijri-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
    .hijri-day{
      padding:6px 2px;text-align:center;border-radius:6px;
      cursor:pointer;font-size:.8rem;color:var(--text);
      transition:all .2s;
      font-weight:800;
    }
    .hijri-day:hover{background:#ecfdf5;}
    .hijri-day.selected{background:var(--primary);color:#fff;}
    .today-btn{
      margin-top:8px;width:100%;padding:7px 10px;
      border:none;border-radius:8px;cursor:pointer;
      font-weight:900;font-size:.85rem;
      background:#ecfdf5;color:var(--dark);
      transition:all .2s;
      font-family:'Tajawal',sans-serif;
    }
    .today-btn:hover{background:var(--primary);color:#fff;}

    .wait-subtitle,.lab-subtitle,.general-subtitle{
      margin-top:20px;margin-bottom:8px;font-size:1.05rem;
      color:var(--dark);font-weight:900;border-right:4px solid var(--accent);
      padding-right:8px;
    }
    .lab-subtitle{border-right-color:var(--lab-color);color:var(--lab-dark);}
    .general-subtitle{border-right-color:#0ea5e9;color:#075985;}

    .table-wrap{
      margin-top:8px;border-radius:12px;overflow:hidden;
      box-shadow:0 6px 18px rgba(15,118,110,.12);
      overflow-x:auto;background:#fff;
    }
    table{width:100%;border-collapse:collapse;min-width:750px;font-size:.8rem;}
    th,td{padding:8px 6px;border-bottom:1px solid #e5e7eb;text-align:center;vertical-align:top;}
    th{
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      color:#fff;font-weight:900;font-size:.78rem;white-space:nowrap;
    }
    .lab-table th{background:linear-gradient(135deg,var(--lab-color),var(--lab-dark));}
    .general-table th{background:linear-gradient(135deg,#0ea5e9,#0369a1);}
    tbody tr:nth-child(even){background:#f9fafb;}
    tbody tr:hover{background:#ecfdf5;}
    td.text-right{text-align:right;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;unicode-bidi:plaintext;}

    .report-header{
      background:linear-gradient(135deg,#14532d,#166534);
      color:#fff;padding:14px 16px;border-radius:10px;
      margin-bottom:18px;text-align:center;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
      border:1px solid rgba(255,255,255,.2);
    }
    .report-header h2{font-size:1.4rem;margin-bottom:10px;font-weight:900;text-shadow:1px 1px 2px rgba(0,0,0,.18);}
    .report-header .ministry{font-size:1.05rem;font-weight:800;margin-bottom:4px;}
    .report-header .program-title{font-size:1.25rem;font-weight:900;margin-top:8px;padding:8px 12px;background:rgba(255,255,255,.12);border-radius:8px;display:inline-block;}

    .toast{
      position:fixed;top:90px;left:50%;transform:translateX(-50%);
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      color:#fff;padding:10px 14px;border-radius:999px;
      font-size:.9rem;font-weight:900;box-shadow:0 8px 20px rgba(15,118,110,.35);
      z-index:2000;animation:fadeIn .2s ease;max-width:92%;text-align:center;
    }
    .toast.warn{background:linear-gradient(135deg,#facc15,#eab308);color:#111827;}
    .toast.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);}
    @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

    .site-footer{
      background:linear-gradient(135deg,var(--primary),var(--dark));
      color:#fff;padding:15px;text-align:center;
      box-shadow:0 -4px 20px rgba(0,0,0,.15);margin-top:30px;
    }
    .site-footer p{margin:5px 0;font-size:14px;font-weight:800;}

    #back-btn{
      position:fixed;top:18px;right:18px;z-index:1200;
      background:var(--primary);color:white;border:none;
      padding:10px 14px;border-radius:12px;cursor:pointer;
      font-family:'Tajawal',sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.18);
      display:none;font-weight:900;
    }

    @media (max-width:768px){
      .cards-container{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));}
      .header-text h1{font-size:1.5rem;}
      .card-page{padding:18px;}
      .report-header{padding:15px;}
      .report-header h2{font-size:1.3rem;}
      .input,textarea,select{font-size:1rem;}
    }
    @media (max-width:480px){
      .cards-container{grid-template-columns:1fr;}
      .header-text h1{font-size:1.3rem;}
      .report-header h2{font-size:1.15rem;}
    }
  </style>

<script src="config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ar.js"></script>
<style>
#local-pages{display:block;padding-bottom:24px}
.school-letterhead{text-align:center;line-height:1.8;color:#047857;border-bottom:2px solid #10b981;padding:14px;margin-bottom:20px;font-weight:800}
.school-letterhead .school-name{font-size:1.3rem;font-weight:900}
.flatpickr-calendar{font-family:Tajawal,Arial,sans-serif;direction:rtl}
.date-note{font-weight:500;color:#64748b;font-size:.8rem}
.report-header{background:linear-gradient(90deg,#00a58f,#005b96)}
.wait-evidence-help{font-size:.83rem;font-weight:500;color:#64748b}
.wait-evidence-previews{display:flex;flex-wrap:wrap;gap:10px}
.wait-evidence-preview{position:relative;width:140px}
.wait-evidence-preview img{display:block;width:140px;height:105px;object-fit:contain;background:#fff;border:1px solid #bbf7d0;border-radius:8px}
.wait-evidence-preview button{position:absolute;top:3px;left:3px;padding:3px 9px;background:#b91c1c;border:0;border-radius:6px;color:#fff;font:inherit;font-weight:800;cursor:pointer}
</style>
</head><body><main id="local-pages">  <section id="wait-section" class="card-page" >
    <header class="school-letterhead" id="schoolLetterhead" style="display:none"></header>
    <div class="report-header">
      <h2>تقرير حصص الانتظار</h2>
    </div>

    <p class="wait-intro">سجلي تفاصيل حصص الانتظار التي قمتِ بتنفيذها. يتم حفظ البيانات محلياً في المتصفح.</p>

    <form id="sesForm" class="form" autocomplete="off">
      <div class="grid-3">
        <label>الأسبوع *
          <select class="input" id="weekNumber" required>
            <option value="">اختاري الأسبوع</option>
            <option>الأول</option><option>الثاني</option><option>الثالث</option><option>الرابع</option><option>الخامس</option>
            <option>السادس</option><option>السابع</option><option>الثامن</option><option>التاسع</option><option>العاشر</option>
            <option>الحادي عشر</option><option>الثاني عشر</option><option>الثالث عشر</option><option>الرابع عشر</option><option>الخامس عشر</option>
          </select>
        </label>

        <label>اليوم *
          <select class="input" id="dayName" required>
            <option value="">اختاري اليوم</option>
            <option>الأحد</option><option>الإثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option>
          </select>
        </label>

        <label for="sessionDate">التاريخ *
          <input class="input" type="text" id="sessionDate" required placeholder="اختر التاريخ">
          <span class="date-note">اختاري من التقويم؛ يظهر التاريخ الهجري في الحقل والتقرير.</span>
        </label>
      </div>

      <div class="grid-3">
        <label>الصف / الفصل *
          <input class="input" id="className" required placeholder="مثال: 2 / أ">
        </label>
        <label>رقم الحصة *
          <input class="input" id="sessionNumber" required placeholder="مثال: 3" inputmode="numeric">
        </label>
        <label>المعلمة الغائبة *
          <input class="input" id="absentTeacher" required placeholder="مثال: أ/ سارة محمد">
        </label>
      </div>

      <label>ما تم تنفيذه مع الطالبات *
        <textarea class="input" id="activitiesText" required placeholder="اكتبي بإيجاز ما تم عمله في حصة الانتظار..."></textarea>
      </label>

      <label for="customActivityType">نوع النشاط *
        <input class="input" type="text" id="customActivityType" required placeholder="اكتبي نوع النشاط">
      </label>

      <label for="waitEvidenceInput">صور الشواهد (اختياري)
        <input class="input" id="waitEvidenceInput" type="file" accept="image/png,image/jpeg,image/webp" multiple>
        <span class="wait-evidence-help">يمكن رفع 4 صور كحد أقصى. تُحفظ الصور مع الحصة في هذا المتصفح.</span>
      </label>
      <div id="waitEvidencePreviews" class="wait-evidence-previews" aria-live="polite"></div>

      <div class="actions">
        <button class="btn" type="button" id="saveSession">حفظ الحصة</button>
        <button class="btn" type="button" id="exportSessions">تصدير / طباعة</button>
        <button class="btn danger" type="button" id="clearAll">مسح جميع الحصص</button>
      </div>
    </form>

    <h3 class="wait-subtitle">الحصص المسجلة</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>م</th><th>الأسبوع</th><th>اليوم</th><th>التاريخ</th>
            <th>الصف</th><th>الحصة</th><th>المعلمة الغائبة</th>
            <th>ما تم تنفيذه</th><th>المجال</th><th>الشواهد</th><th>إجراء</th>
          </tr>
        </thead>
        <tbody id="sessionsBody"></tbody>
      </table>
    </div>
  </section>

</main><script>
  function showToast(msg,type){
    type = type || '';
    const t=document.createElement('div');
    t.className='toast'+(type?' '+type:'');
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .25s';},1400);
    setTimeout(()=>{t.remove();},1900);
  }

  function escapeHtml(text){
    if(text===null || text===undefined) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function safeSetStorage(key, value){
    try{
      localStorage.setItem(key, value);
      return true;
    }catch(e){
      showToast('التخزين المحلي ممتلئ أو ممنوع على هذا المتصفح. افتحي التصفح الخاص؟ اغلقيه.','danger');
      return false;
    }
  }

  function safeGetStorage(key){
    try{
      return localStorage.getItem(key);
    }catch(e){
      return null;
    }
  }

  function openPrintWindow(html){
    const w = window.open('', '_blank');
    if(!w){ showToast('المتصفح منع فتح نافذة. فعّلي Popups.','warn'); return; }
    w.document.open();
    w.document.write(html);
    w.document.close();
    w.document.title = ''; // يقلل ظهور عنوان
    w.onload = async function(){
      try{
        if(w.document.fonts && w.document.fonts.ready) await w.document.fonts.ready;
      }catch(_){}
      setTimeout(()=>{ try{ w.focus(); w.print(); }catch(_){} }, 250);
    };
  }

  let waitSessions=[];
  let waitEvidenceImages=[];
  let waitEvidenceLoading=false;

  function waitRenderEvidence(){
    const previewArea=document.getElementById('waitEvidencePreviews');
    previewArea.replaceChildren();
    waitEvidenceImages.forEach((source,i)=>{
      const wrapper=document.createElement('div');
      wrapper.className='wait-evidence-preview';
      const image=document.createElement('img');
      image.src=source;
      image.alt='شاهد '+(i+1);
      const remove=document.createElement('button');
      remove.type='button';
      remove.textContent='×';
      remove.setAttribute('aria-label','حذف الشاهد '+(i+1));
      remove.addEventListener('click',()=>{
        if(waitEvidenceLoading) return;
        waitEvidenceImages.splice(i,1);
        waitRenderEvidence();
      });
      wrapper.append(image,remove);
      previewArea.append(wrapper);
    });
  }

  function waitCompressEvidence(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onerror=()=>reject(new Error('read'));
      reader.onload=()=>{
        const image=new Image();
        image.onerror=()=>reject(new Error('image'));
        image.onload=()=>{
          try{
            const scale=Math.min(1,1100/Math.max(image.width,image.height));
            const canvas=document.createElement('canvas');
            canvas.width=Math.max(1,Math.round(image.width*scale));
            canvas.height=Math.max(1,Math.round(image.height*scale));
            const context=canvas.getContext('2d');
            context.fillStyle='#fff';
            context.fillRect(0,0,canvas.width,canvas.height);
            context.drawImage(image,0,0,canvas.width,canvas.height);
            resolve(canvas.toDataURL('image/jpeg',.76));
          }catch(error){reject(error);}
        };
        image.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function waitInitEvidence(){
    document.getElementById('waitEvidenceInput').addEventListener('change',async event=>{
      const files=[...event.target.files];
      event.target.value='';
      if(!files.length) return;
      if(waitEvidenceLoading){showToast('انتظري حتى يكتمل تجهيز الصور','warn');return;}
      if(waitEvidenceImages.length+files.length>4){
        showToast('يمكن رفع 4 صور كحد أقصى','warn');return;
      }
      if(files.some(file=>!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>12*1024*1024)){
        showToast('اختاري صور JPG أو PNG أو WebP، بحد أقصى 12 ميجابايت لكل صورة','warn');return;
      }
      waitEvidenceLoading=true;
      try{
        const added=await Promise.all(files.map(waitCompressEvidence));
        waitEvidenceImages.push(...added);
        waitRenderEvidence();
      }catch(error){showToast('تعذرت قراءة إحدى الصور، لم تتم إضافتها','danger');}
      finally{waitEvidenceLoading=false;}
    });
  }

  function waitLoadSessions(){
    const saved=safeGetStorage('w26_waiting_sessions');
    if(saved){
      try{ waitSessions=JSON.parse(saved)||[]; }catch(_){ waitSessions=[]; }
    }
    renderWaitSessions();
  }
  function waitSaveSessions(){
    return safeSetStorage('w26_waiting_sessions', JSON.stringify(waitSessions));
  }

  function renderWaitSessions(){
    const body=document.getElementById('sessionsBody');
    if(!body) return;
    body.innerHTML='';
    waitSessions.forEach((s,i)=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${i+1}</td>
        <td>${escapeHtml(s.week)}</td>
        <td>${escapeHtml(s.day)}</td>
        <td>${escapeHtml(s.date)}</td>
        <td>${escapeHtml(s.className)}</td>
        <td>${escapeHtml(s.number)}</td>
        <td>${escapeHtml(s.teacher)}</td>
        <td class="text-right">${escapeHtml(s.activities)}</td>
        <td class="text-right">${escapeHtml(s.fields)}</td>
        <td>${Array.isArray(s.evidence)&&s.evidence.length ? s.evidence.length+' صورة' : '—'}</td>
        <td>
          <button class="btn danger" style="width:auto;padding:4px 10px;font-size:.75rem;border-radius:999px;box-shadow:none;"
                  type="button" data-del-wait="${i}">حذف</button>
        </td>`;
      body.appendChild(tr);
    });

    body.querySelectorAll('[data-del-wait]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const i = Number(b.dataset.delWait);
        if(!confirm('هل تريدين حذف هذه الحصة؟')) return;
        const deleted=waitSessions.splice(i,1)[0];
        if(!waitSaveSessions()){waitSessions.splice(i,0,deleted);return;}
        renderWaitSessions();
        showToast('تم حذف الحصة');
      });
    });
  }

  function buildWaitPrintHTML(list){
    const background='https://defullah2010-svg.github.io/AC1397/images/background.png';
    const field=(label,value)=>`<div class="field"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value||'')}</div></div>`;
    const pages=list.map((s,i)=>`<section class="sheet${Array.isArray(s.evidence)&&s.evidence.length?' has-evidence':''}">
      <img class="letterhead" src="${background}" alt="ديباجة وزارة التعليم">
      <div class="report-title"><span>تقرير حصص الانتظار</span></div>
      <main class="report-content">
        <div class="fields two">${field('إدارة التعليم',SCHOOL.department)}${field('اسم المدرسة',SCHOOL.schoolName)}</div>
        <div class="fields three">${field('الأسبوع',s.week)}${field('اليوم',s.day)}${field('التاريخ',s.date)}</div>
        <div class="fields three">${field('الصف / الفصل',s.className)}${field('رقم الحصة',s.number)}${field('المعلمة الغائبة',s.teacher)}</div>
        <div class="field activity"><div class="label">ما تم تنفيذه مع الطالبات</div><div class="value">${escapeHtml(s.activities||'')}</div></div>
        <div class="field"><div class="label">المجال / نوع النشاط</div><div class="value">${escapeHtml(s.fields||'')}</div></div>
        ${Array.isArray(s.evidence)&&s.evidence.length ? `<div class="field evidence"><div class="label">صور الشواهد</div><div class="evidence-grid">${s.evidence.filter(src=>typeof src==='string'&&/^data:image\/(?:jpeg|png|webp);base64,/.test(src)).slice(0,4).map((src,j)=>`<img src="${escapeHtml(src)}" alt="شاهد ${j+1}">`).join('')}</div></div>` : ''}
        <div class="signature">${field('مديرة المدرسة',SCHOOL.principal)}</div>
      </main>
    </section>`).join('');
    return `<!DOCTYPE html><html lang="ar" dir="rtl"><head>
      <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
      <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
      <title>تقرير حصص الانتظار</title><style>
      *{box-sizing:border-box}
      @page{size:A4 portrait;margin:0}
      body{margin:0;background:#e5e7eb;font-family:Tajawal,Arial,sans-serif;color:#153e50}
      .sheet{position:relative;width:210mm;min-height:297mm;margin:8mm auto;background:#fff;padding:52mm 10mm 22mm;isolation:isolate}
      .sheet + .sheet{break-before:page;page-break-before:always}
      .letterhead{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:-1}
      .report-title{position:absolute;top:39mm;right:50mm;left:50mm;height:11mm;background:#fff;display:flex;align-items:center;justify-content:center}
      .report-title span{background:linear-gradient(90deg,#00a58f,#005b96);color:#fff;border-radius:6mm;width:72mm;text-align:center;padding:1mm 3mm;font-size:12pt;font-weight:800}
      .fields{display:grid;gap:3mm;margin-bottom:4mm}
      .two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}
      .field{min-width:0;margin-bottom:4mm;break-inside:avoid;page-break-inside:avoid}
      .fields .field{margin-bottom:0}
      .label{color:#fff;background:linear-gradient(90deg,#00a58f,#005b96);border-radius:1.5mm;padding:1mm 2mm;text-align:center;font-size:11pt;font-weight:800;print-color-adjust:exact;-webkit-print-color-adjust:exact}
      .value{border:1px solid #00758d;border-radius:1.5mm;margin-top:1mm;padding:2mm 3mm;min-height:11mm;font-size:11.5pt;text-align:center;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
      .activity .value{min-height:45mm;text-align:right;font-size:12pt}
      .signature{width:75mm;margin-top:12mm;margin-right:auto}
      .evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2mm;margin-top:2mm}
      .evidence-grid img{display:block;width:100%;height:28mm;object-fit:contain;background:#fff;border:1px solid #bdd4d4;border-radius:1mm}
      .has-evidence .activity .value{min-height:26mm}
      .has-evidence .signature{margin-top:4mm}
      @media print{html,body{margin:0!important;padding:0!important;height:auto!important;min-height:0!important;background:#fff}.sheet{margin:0!important;width:210mm;height:294mm;min-height:0!important;box-shadow:none;break-inside:avoid;page-break-inside:avoid}.sheet:last-child{break-after:auto!important;page-break-after:auto!important}.letterhead{height:294mm}.report-title span{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
      </style></head><body>${pages}</body></html>`;
  }

  function initWaitForm(){
    document.getElementById('saveSession').addEventListener('click', ()=>{
      const week=document.getElementById('weekNumber').value;
      const day=document.getElementById('dayName').value;
      const date=getSessionDate();
      const className=document.getElementById('className').value.trim();
      const number=document.getElementById('sessionNumber').value.trim();
      const teacher=document.getElementById('absentTeacher').value.trim();
      const activities=document.getElementById('activitiesText').value.trim();
      if(waitEvidenceLoading){showToast('انتظري اكتمال تجهيز صور الشواهد','warn');return;}

      const fields=[];
      const customActivityType=document.getElementById('customActivityType').value.trim();
      if(customActivityType) fields.push(customActivityType);

      if(!week||!day||!date||!className||!number||!teacher||!activities||fields.length===0){
        showToast('أكملي جميع الحقول واكتبي نوع النشاط','warn'); return;
      }

      waitSessions.push({week,day,date,className,number,teacher,activities,fields:fields.join('، '),evidence:[...waitEvidenceImages]});
      if(!waitSaveSessions()){waitSessions.pop();return;}
      renderWaitSessions();
      document.getElementById('sesForm').reset();
      if(datePicker) datePicker.clear();
      waitEvidenceImages=[];
      waitRenderEvidence();
      showToast('تم حفظ الحصة');
    });

    document.getElementById('clearAll').addEventListener('click', ()=>{
      if(!waitSessions.length){showToast('لا توجد حصص مسجلة','warn');return;}
      if(!confirm('مسح جميع حصص الانتظار؟')) return;
      const previous=waitSessions;
      waitSessions=[];
      if(!waitSaveSessions()){waitSessions=previous;return;}
      renderWaitSessions();
      showToast('تم مسح جميع الحصص');
    });

    document.getElementById('exportSessions').addEventListener('click', ()=>{
      if(!waitSessions.length){showToast('لا توجد حصص مسجلة','warn');return;}
      openPrintWindow(buildWaitPrintHTML(waitSessions));
    });
  }


  const SCHOOL=Object.assign({country:'المملكة العربية السعودية',ministry:'وزارة التعليم',department:'الإدارة العامة للتعليم بمنطقة تبوك',schoolName:'الابتدائية السابعة بالوجه',principal:'هديل الطيار'},window.SCHOOL_CONFIG||{});
  function schoolLetterheadHTML(){
    return `<div class="school-letterhead"><div>${escapeHtml(SCHOOL.country)}</div><div>${escapeHtml(SCHOOL.ministry)}</div><div>${escapeHtml(SCHOOL.department)}</div><div class="school-name">${escapeHtml(SCHOOL.schoolName)}</div></div>`;
  }
  const hijriFormatter=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'2-digit',month:'2-digit',year:'numeric'});
  function formatHijriDate(date){return hijriFormatter.format(date);}
  let datePicker=null;
  function getSessionDate(){
    if(datePicker) return datePicker.selectedDates.length ? formatHijriDate(datePicker.selectedDates[0]) : '';
    const value=document.getElementById('sessionDate').value;
    return value ? formatHijriDate(new Date(value+'T12:00:00')) : '';
  }
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('schoolLetterhead').innerHTML=schoolLetterheadHTML();
    const input=document.getElementById('sessionDate');
    if(typeof flatpickr==='function'){
      datePicker=flatpickr(input,{locale:'ar',disableMobile:true,altInput:true,altInputClass:'input',altFormat:'d/m/Y',dateFormat:'Y-m-d',allowInput:false,
        onChange:(dates,value,instance)=>{instance.altInput.value=dates.length ? formatHijriDate(dates[0]) : '';}
      });
      datePicker.altInput.id='sessionDateDisplay';
      document.querySelector('label[for="sessionDate"]').htmlFor='sessionDateDisplay';
    }else{input.type='date';}
    waitLoadSessions();
    waitInitEvidence();
    initWaitForm();
  });
</script></body></html>
