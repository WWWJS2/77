<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام التقارير الإلكترونية | الابتدائية السابعة بالوجه</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:#f0fdf4;color:#0f172a}.top{background:#124f3d;color:white;text-align:center;padding:18px 12px;line-height:1.8}.top b{font-size:20px}.hero{background:white;text-align:center;padding:20px 12px;border-bottom:2px solid #d1fae5}.hero h1{color:#047857;margin:0 0 6px}.hero p{margin:0;color:#64748b}.q{color:#047857;font-weight:800;margin-top:10px}.main{background:linear-gradient(135deg,#10b981,#059669);padding:22px 4vw 35px;min-height:62vh}.main h2{text-align:center;color:white;margin:0 0 20px}.cards{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{border:0;background:white;border-radius:15px;padding:20px 12px;box-shadow:0 6px 16px #064e3b22;cursor:pointer;font-family:inherit;transition:.2s}.card:hover{transform:translateY(-4px)}.ico{font-size:34px}.ttl{font-weight:900;color:#047857;font-size:18px;margin-top:8px}.sub{font-size:13px;color:#64748b;margin-top:5px}.special{border-top:4px solid #fbbf24}.purple{border-top:4px solid #8b5cf6}.footer{text-align:center;background:#047857;color:white;padding:16px;font-weight:700}.viewer{display:none;position:fixed;inset:0;background:white;z-index:20}.bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #ddd}.back{border:0;background:#10b981;color:white;border-radius:10px;padding:9px 15px;font-weight:900;cursor:pointer}.frame{width:100%;height:calc(100vh - 58px);border:0}.notice{display:none;max-width:850px;margin:25px auto;background:white;padding:25px;border-radius:18px;box-shadow:0 8px 28px #064e3b22}.notice h2{color:#047857}.notice button{border:0;background:#10b981;color:white;padding:10px 16px;border-radius:10px;font-weight:800;cursor:pointer}@media(max-width:600px){.top b{font-size:17px}.hero h1{font-size:24px}.cards{grid-template-columns:1fr}}</style></head><body><section class="top"><div id="country"></div><div id="ministry"></div><div id="department"></div><b id="school"></b></section><section class="hero"><h1>نظام التقارير الإلكترونية</h1><p>منصة متكاملة لإدارة التقارير المدرسية</p><div class="q">﴿ وَقُلْ رَبِّ زِدْنِي عِلْمًا ﴾</div></section><main class="main" id="home"><h2>تقارير المدرسة الشاملة</h2><div class="cards"><button class="card" onclick="go('https://defullah2010-svg.github.io/R1397/','التقارير')"><div class="ico">🗓️</div><div class="ttl">التقارير</div><div class="sub">اليومي • الأسبوعي • الشهري</div></button><button class="card" onclick="go('https://defullah2010-svg.github.io/A1397/','النشاط الطلابي')"><div class="ico">🌟</div><div class="ttl">النشاط الطلابي</div></button><button class="card" onclick="go('https://defullah2010-svg.github.io/AC1397/','الأنشطة اللاصفية')"><div class="ico">🧩</div><div class="ttl">الأنشطة اللاصفية</div></button><button class="card" onclick="go('https://defullah2010-svg.github.io/Trace1397/','متابعة الأنشطة')"><div class="ico">📋</div><div class="ttl">متابعة الأنشطة</div></button><button class="card" onclick="go('https://defullah2010-svg.github.io/L1397/','التواصل مع أولياء الأمور')"><div class="ico">📞</div><div class="ttl">التواصل مع أولياء الأمور</div></button><button class="card" onclick="go('https://defullah2010-svg.github.io/T1397/','التوجيه الطلابي')"><div class="ico">🎓</div><div class="ttl">التوجيه الطلابي</div></button><button class="card" onclick="go('https://defullah2010-svg.github.io/V1397/','تبادل الزيارات')"><div class="ico">📝</div><div class="ttl">تبادل الزيارات</div></button><button class="card special" onclick="localPage('حصة الانتظار')"><div class="ico">⏳</div><div class="ttl">حصة الانتظار</div><div class="sub">تسجيل ومتابعة حصص الانتظار</div></button><button class="card purple" onclick="localPage('المختبرات')"><div class="ico">🔬</div><div class="ttl">المختبرات</div><div class="sub">تقارير البرامج والتجارب</div></button><button class="card special" onclick="localPage('التقرير العام')"><div class="ico">📊</div><div class="ttl">التقرير العام</div><div class="sub">إعداد تقرير عام للبرنامج أو النشاط</div></button></div></main><section class="notice" id="notice"><h2 id="noticeTitle"></h2><p>هذا القسم مخصص لتقارير <b id="noticeName"></b> في الابتدائية السابعة بالوجه.</p><p>مديرة المدرسة: <b>هديل الطيار</b></p><button onclick="back()">العودة للرئيسية</button></section><div class="viewer" id="viewer"><div class="bar"><b id="viewTitle"></b><button class="back" onclick="closeViewer()">العودة</button></div><iframe class="frame" id="frame"></iframe></div><footer class="footer">الابتدائية السابعة بالوجه — مديرة المدرسة: هديل الطيار</footer><script>const C=window.SCHOOL_CONFIG||{};document.getElementById('country').textContent=C.country||'المملكة العربية السعودية';document.getElementById('ministry').textContent=C.ministry||'وزارة التعليم';document.getElementById('department').textContent=C.department||'الإدارة العامة للتعليم بمنطقة تبوك';document.getElementById('school').textContent=C.schoolName||'الابتدائية السابعة بالوجه';function go(u,t){document.getElementById('viewer').style.display='block';document.getElementById('viewTitle').textContent=t;document.getElementById('frame').src=u}function closeViewer(){document.getElementById('viewer').style.display='none';document.getElementById('frame').src='about:blank'}function localPage(n){document.getElementById('home').style.display='none';document.getElementById('notice').style.display='block';document.getElementById('noticeTitle').textContent=n;document.getElementById('noticeName').textContent=n;scrollTo(0,0)}function back(){document.getElementById('notice').style.display='none';document.getElementById('home').style.display='block'}</script></body></html>
